# The Symbian side: NEONET.EXE as a staticlib for build/emitter/build_rust_exe.py (exes.txt). Its own workspace:
# built only for armv5te-none-eabi with the pinned nightly (`cargo arm`), like telephony/symbian.
[workspace]
members = ["neonet"]
resolver = "2"

[workspace.dependencies]
# NeoSymbian/e32-rs, the same revision as neoui and telephony
e32 = { git = "https://github.com/NeoSymbian/e32-rs", rev = "e97e2ebcb242f5365d1b3f9d520646603e1e9056", features = ["critical-section"] }
net = { path = "../crates/net" }

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true

[profile.dev]
panic = "abort"
