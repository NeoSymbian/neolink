# SPDX-License-Identifier: Apache-2.0
[package]
name = "wpa"
description = "WPA2-PSK for NeoSymbian: the passphrase hash and the 4-way/group key handshakes (supplicant side, sans-I/O)"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
sha1 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
aes-kw = { version = "0.3", default-features = false }
